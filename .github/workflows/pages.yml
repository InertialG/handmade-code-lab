name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Install Worker dependencies
        run: npm ci --prefix ../worker
      - name: Typecheck
        run: npm run typecheck && npm run typecheck:test && npm --prefix ../worker run typecheck
      - name: Test
        run: npm test && npm --prefix ../worker test
      - name: Build
        env:
          # Pages 子路径：https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # 在仓库 Settings → Variables 里配置 Worker 地址
          VITE_PROXY_BASE: ${{ vars.VITE_PROXY_BASE }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
